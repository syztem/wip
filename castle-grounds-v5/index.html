<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <script type="importmap">
  {
    "imports": {
      "three": "./vendor/three/build/three.core.js",
      "three/webgpu": "./vendor/three/build/three.webgpu.js",
      "three/tsl": "./vendor/three/build/three.tsl.js",
      "three/addons/": "./vendor/three/examples/jsm/"
    }
  }
  </script>
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="color-scheme" content="dark" />
  <meta name="theme-color" content="#7eb7e8" />
  <meta name="description" content="Property Plumbers: a 90s listing tour of the keep. Mario demos. Luigi stays. three.js r186." />
  <title>Property Plumbers — Castle Grounds</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect fill='%231a6b32' width='32' height='32'/%3E%3Crect x='10' y='8' width='12' height='14' fill='%23f2e2c4'/%3E%3Cpolygon points='10,8 16,3 22,8' fill='%23c42a2a'/%3E%3C/svg%3E" />
  <style>
    html, body {
      margin: 0; height: 100%; overflow: hidden; background: #7eb7e8;
      overscroll-behavior: none; touch-action: none;
    }
    canvas {
      display: block; width: 100%; height: 100%; touch-action: none;
      background: #7eb7e8;
    }
    #boot {
      position: fixed; inset: 0; z-index: 8;
      display: grid; place-items: center;
      background: #6aa8dc;
      transition: opacity 0.7s ease, visibility 0.7s ease;
    }
    #boot .mark {
      font: 600 13px/1 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      letter-spacing: 0.32em; text-transform: uppercase; color: #fff4d6;
    }
    #boot .sub {
      margin-top: 10px;
      font: 11px/1 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      letter-spacing: 0.14em; color: rgba(255, 244, 214, 0.55);
    }
    body.live #boot { opacity: 0; visibility: hidden; pointer-events: none; }
    body.dead #boot { display: none; }
    #fps {
      position: fixed; z-index: 4; pointer-events: none;
      top: max(28px, calc(env(safe-area-inset-top) + 22px));
      right: max(14px, env(safe-area-inset-right));
      font: 11px/1 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      color: rgba(255, 255, 255, 0.42);
      text-shadow: 0 1px 2px rgba(0,0,0,.55);
    }
    #err {
      position: fixed; inset: 0; display: none; place-items: center;
      padding:
        calc(24px + env(safe-area-inset-top, 0px))
        calc(24px + env(safe-area-inset-right, 0px))
        calc(24px + env(safe-area-inset-bottom, 0px))
        calc(24px + env(safe-area-inset-left, 0px));
      background: #102018; color: #ffb4a0;
      font: 14px/1.5 system-ui, sans-serif; z-index: 9;
      text-align: center; white-space: pre-wrap;
    }
    #hud {
      position: fixed; inset: 0; z-index: 3; pointer-events: none;
      color: #fff6d8;
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    }
    #hud .bars i {
      position: absolute; left: 0; right: 0; height: 42px;
      background: linear-gradient(#05080c, transparent);
    }
    #hud .bars i:last-child {
      top: auto; bottom: 0;
      background: linear-gradient(transparent, #05080c);
      height: 56px;
    }
    #hud .chrome {
      position: absolute; left: 0; right: 0;
      display: flex; justify-content: space-between; align-items: baseline;
      padding: 10px 16px;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      font-size: 10px;
      color: rgba(255, 246, 216, 0.78);
      text-shadow: 0 1px 2px rgba(0,0,0,.7);
    }
    #hud .chrome.top { top: 0; padding-top: max(10px, env(safe-area-inset-top)); }
    #hud .chrome.bot {
      bottom: 0;
      display: block;
      padding-bottom: max(10px, env(safe-area-inset-bottom));
    }
    #hud .brand { display: flex; gap: 10px; align-items: baseline; }
    #hud .mark {
      border: 1px solid rgba(255,246,216,.7);
      padding: 2px 5px 1px;
      letter-spacing: 0.22em;
      font-weight: 700;
    }
    #hud .card {
      position: absolute;
      left: 16px; right: 16px;
      bottom: 78px;
      opacity: 0;
      transform: translateY(8px);
      transition: opacity 0.55s ease, transform 0.55s ease;
    }
    #hud .card.in.hold {
      opacity: 1;
      transform: none;
    }
    #hud .kicker {
      font-size: 10px;
      letter-spacing: 0.28em;
      text-transform: uppercase;
      color: rgba(255, 210, 120, 0.9);
      text-shadow: 0 1px 2px rgba(0,0,0,.75);
    }
    #hud .title {
      margin-top: 6px;
      font-size: clamp(18px, 3.4vw, 34px);
      letter-spacing: 0.12em;
      font-weight: 700;
      text-transform: uppercase;
      text-shadow: 0 2px 10px rgba(0,0,0,.55);
    }
    #hud .line {
      margin-top: 6px;
      max-width: 42rem;
      font-size: 12px;
      letter-spacing: 0.04em;
      color: rgba(255,246,216,.78);
      text-shadow: 0 1px 3px rgba(0,0,0,.7);
    }
    #hud .ticker {
      font-size: 10px;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: rgba(255,246,216,.55);
      margin-bottom: 6px;
    }
    #hud .meter {
      height: 2px;
      background: rgba(255,246,216,.18);
    }
    #hud .meter b {
      display: block;
      height: 100%;
      width: 100%;
      background: #ffd36a;
      transform-origin: left center;
      transform: scaleX(0);
    }
    #hud.flash .bars i {
      background: #f4fbff;
    }
    #hud .card.dim {
      opacity: 0.78;
    }
    #hud .card {
      left: 16px;
      right: auto;
      max-width: min(36rem, calc(100% - 32px));
      padding-left: 10px;
      border-left: 3px solid #ffd36a;
    }
    @media (max-width: 640px) {
      #hud .title { font-size: 18px; }
      #hud .line { font-size: 11px; }
      #hud .card { bottom: 68px; }
    }
    @media (prefers-reduced-motion: reduce) {
      #boot { transition: none; }
      #hud .card { transition: none; }
    }
  </style>
</head>
<body>
  <div id="boot">
    <div>
      <div class="mark">property plumbers</div>
      <div class="sub">ep 07 · the keep · 90s listing tour</div>
    </div>
  </div>
  <div id="fps"></div>
  <div id="err"></div>
  <noscript>JavaScript required.</noscript>
  <script>
    (function () {
      var p = location.pathname;
      if (p.slice(-1) !== '/' && !/\.[a-zA-Z0-9]+$/.test(p)) {
        location.replace(p + '/' + location.search + location.hash);
      }
      function die(msg) {
        document.body.classList.add('dead');
        var err = document.getElementById('err');
        if (err) { err.style.display = 'grid'; err.textContent = msg; }
      }
      if (!HTMLScriptElement.supports || !HTMLScriptElement.supports('importmap')) {
        die('Need a current Firefox, Chrome, Edge, or Safari (import maps).');
        return;
      }
      window.addEventListener('error', function (e) {
        if (document.body.classList.contains('live') || document.body.classList.contains('dead')) return;
        die((e && e.message) ? e.message : 'script error');
      });
      window.addEventListener('unhandledrejection', function (e) {
        if (document.body.classList.contains('live') || document.body.classList.contains('dead')) return;
        var r = e && e.reason;
        die((r && r.message) ? r.message : String(r || 'boot failed'));
      });
      setTimeout(function () {
        if (!document.body.classList.contains('live') && !document.body.classList.contains('dead')) {
          die('Boot stalled. Hard-refresh. If it persists, the renderer never finished.');
        }
      }, 12000);
    })();
  </script>
  <script type="module" src="./src/main.js"></script>
</body>
</html>
