<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>cozy-creek v01 — M1 ≥60fps target</title>
<style>
html,body{margin:0;height:100%;background:#0b1210;color:#dce6df;font:13px/1.4 system-ui,sans-serif}
#c{display:block;width:100%;height:100%}
#hud{position:fixed;left:10px;top:10px;background:rgba(0,0,0,.7);padding:10px 12px;border-radius:8px;max-width:340px}
#hud.bad{outline:2px solid #e55}
#hud.ok{outline:2px solid #3c8}
code{color:#9cf}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hud">
  <b>cozy-creek v01</b> · three r186 · target <b>M1 ≥60 fps</b>
  <div id="stat">loading…</div>
  <div>land lightMap ch=1 · water scroll · lights none</div>
</div>
<script type="module">
import * as THREE from '/threejs/three.js-r186/build/three.module.js';
import { GLTFLoader } from '/threejs/three.js-r186/examples/jsm/loaders/GLTFLoader.js';
import { OrbitControls } from '/threejs/three.js-r186/examples/jsm/controls/OrbitControls.js';

const TARGET = 60;
const canvas = document.getElementById('c');
const hud = document.getElementById('hud');
const stat = document.getElementById('stat');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, powerPreference: 'high-performance' });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.outputColorSpace = THREE.SRGBColorSpace;

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x87a0b0);
scene.fog = new THREE.Fog(0x87a0b0, 8, 28);

const camera = new THREE.PerspectiveCamera(50, innerWidth / innerHeight, 0.05, 100);
camera.position.set(6.5, 3.2, 5.5);
const controls = new OrbitControls(camera, canvas);
controls.target.set(0, 0.2, 0);
controls.enableDamping = true;
controls.autoRotate = true;
controls.autoRotateSpeed = 0.6;
controls.update();

const t0 = performance.now();
const lightMap = await new Promise((res, rej) => {
  new THREE.TextureLoader().load('/cozy-creek/v01/web/lightmap_512_web.png', res, undefined, rej);
});
lightMap.channel = 1;
lightMap.flipY = false;
lightMap.colorSpace = THREE.LinearSRGBColorSpace;
lightMap.needsUpdate = true;

// cheap water normal (procedural data URI checker replaced by canvas noise)
function makeWaterNormal() {
  const c = document.createElement('canvas');
  c.width = c.height = 256;
  const g = c.getContext('2d');
  const img = g.createImageData(256, 256);
  for (let i = 0; i < img.data.length; i += 4) {
    const n = 128 + (Math.random() * 40 - 20);
    img.data[i] = n; img.data[i+1] = n; img.data[i+2] = 255; img.data[i+3] = 255;
  }
  g.putImageData(img, 0, 0);
  const t = new THREE.CanvasTexture(c);
  t.wrapS = t.wrapT = THREE.RepeatWrapping;
  t.repeat.set(4, 4);
  return t;
}
const waterNormal = makeWaterNormal();

const gltf = await new Promise((res, rej) => {
  new GLTFLoader().load('/cozy-creek/v01/gltf/cozy_blockout.glb', res, undefined, rej);
});

let waterMesh = null;
gltf.scene.traverse((o) => {
  if (!o.isMesh) return;
  const name = (o.name || '').toLowerCase();
  const isWater = name.includes('water') || (o.material && (o.material.name || '').toLowerCase().includes('water'));
  if (isWater) {
    waterMesh = o;
    const m = new THREE.MeshStandardMaterial({
      color: 0x2a6a7a,
      metalness: 0.1,
      roughness: 0.25,
      transparent: true,
      opacity: 0.82,
      normalMap: waterNormal,
      normalScale: new THREE.Vector2(0.6, 0.6),
      depthWrite: false,
    });
    // depth-ish: darker toward camera far via fog already; slight emissive
    m.emissive = new THREE.Color(0x0a2030);
    m.emissiveIntensity = 0.05;
    o.material = m;
    o.renderOrder = 2;
    return;
  }
  const g = o.geometry;
  if (!g.attributes.uv1 && g.attributes.uv) g.setAttribute('uv1', g.attributes.uv.clone());
  const apply = (mat) => {
    if (!mat) return;
    mat.lightMap = lightMap;
    mat.lightMapIntensity = 1.0;
    mat.needsUpdate = true;
  };
  if (Array.isArray(o.material)) o.material.forEach(apply);
  else apply(o.material);
});
scene.add(gltf.scene);

const loadMs = performance.now() - t0;
let frames = 0, fps = 0, last = performance.now();
const fpsSamples = [];

function tick(now) {
  frames++;
  const dt = (now - last) / 1000;
  if (waterMesh && waterMesh.material && waterMesh.material.normalMap) {
    waterMesh.material.normalMap.offset.x += dt * 0.03;
    waterMesh.material.normalMap.offset.y += dt * 0.02;
  }
  if (now - last >= 1000) {
    fps = frames;
    frames = 0;
    last = now;
    if (fpsSamples.length < 30) fpsSamples.push(fps);
    const med = [...fpsSamples].sort((a,b)=>a-b)[Math.floor(fpsSamples.length/2)] || fps;
    const ok = med >= TARGET;
    hud.className = ok ? 'ok' : 'bad';
    const info = renderer.info;
    stat.textContent = `load ${loadMs.toFixed(0)}ms · ${fps} fps (med ${med}) · tris ${info.render.triangles} · M1 target ${TARGET}+ ${ok ? 'PASS' : '…sampling'}`;
    window.__cozy = { fps, med, samples: fpsSamples.slice(), loadMs, TARGET, THREE, scene, renderer };
  }
  controls.update();
  renderer.render(scene, camera);
  requestAnimationFrame(tick);
}
requestAnimationFrame(tick);
addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});
</script>
</body>
</html>
